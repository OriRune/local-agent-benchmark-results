name: Selected public release checks
on:
  pull_request:
    paths: ['public/data/**', 'public/previews/**', '.github/workflows/publication.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run deployment:check
      - run: npm run check
      - run: npm test
      # Missing selected data fails here; it is never replaced with fixtures.
      - run: npm run build
      - run: npm run scan:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
